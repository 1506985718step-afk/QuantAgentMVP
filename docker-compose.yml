
version: '3.8'

services:
  # Python Backend Service
  backend:
    build: 
      context: .
      dockerfile: backend/Dockerfile
    container_name: quant_backend
    volumes:
      - ./data_backup:/app/data
    environment:
      - MODE=${MODE:-live}
      - TZ=Asia/Shanghai
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-quant}:${DB_PASSWORD:-password}@db:5432/${DB_NAME:-quant_db}
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost}
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - quant_net

  # TruthStore (PostgreSQL)
  db:
    image: postgres:15-alpine
    container_name: quant_db
    environment:
      - POSTGRES_USER=${DB_USER:-quant}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-password}
      - POSTGRES_DB=${DB_NAME:-quant_db}
    volumes:
      - ./pg_data:/var/lib/postgresql/data
      - ./backend/sql:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - quant_net

  # Nginx Frontend & Proxy
  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    container_name: quant_nginx
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - quant_net

networks:
  quant_net:
    driver: bridge
