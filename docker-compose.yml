
version: '3.8'

services:
  # Python Backend Service
  backend:
    build: 
      context: .
      dockerfile: backend/Dockerfile
    container_name: quant_backend
    volumes:
      # Data Persistence: Host Directory Mounting for easier backup
      # Now you can simply backup the './data_backup' folder on your server
      - ./data_backup:/app/data
    environment:
      - MODE=${MODE:-live}
      - TZ=Asia/Shanghai
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - SECRET_KEY=${SECRET_KEY}
      # Admin Credentials (defined in .env)
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      # Security: Allow specific CORS origins (comma separated)
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost}
    restart: unless-stopped
    networks:
      - quant_net

  # Nginx Frontend & Proxy
  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    container_name: quant_nginx
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - quant_net

networks:
  quant_net:
    driver: bridge
