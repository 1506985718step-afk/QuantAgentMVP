
version: '3.8'

services:
  # Python Backend Service
  backend:
    build: 
      context: backend
      dockerfile: Dockerfile
    container_name: quant_backend
    volumes:
      - ./data_backup:/app/data
    environment:
      # Application Mode
      - MODE=${MODE:-mock}
      - TZ=Asia/Shanghai
      
      # Secrets (Use .env for actual values)
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - SECRET_KEY=${SECRET_KEY:-local_dev_secret}
      
      # Database Connection
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-quant}:${DB_PASSWORD:-password}@db:5432/${DB_NAME:-quant_db}
      
      # Admin Account
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      
      # CORS: Automatically handle localhost or custom domain
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost,https://localhost,http://127.0.0.1}
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - quant_net

  # TruthStore (PostgreSQL)
  db:
    image: postgres:15-alpine
    container_name: quant_db
    environment:
      - POSTGRES_USER=${DB_USER:-quant}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-password}
      - POSTGRES_DB=${DB_NAME:-quant_db}
    volumes:
      - ./pg_data:/var/lib/postgresql/data
      - ./backend/sql:/docker-entrypoint-initdb.d
    expose:
      - "5432"
    restart: unless-stopped
    networks:
      - quant_net

  # Nginx Frontend (Internal Web Server)
  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    container_name: quant_nginx
    expose:
      - "80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - quant_net

  # Caddy Gateway (Reverse Proxy)
  caddy:
    image: caddy:2-alpine
    container_name: quant_gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:-localhost}
    depends_on:
      - frontend
      - backend
    networks:
      - quant_net

networks:
  quant_net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
